<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutEgg</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <span class="logo">🥚 NutEgg</span>
        <div class="header-actions">
          <button id="mode-toggle-btn" class="mode-toggle-btn" title="Switch popup/sidebar">📌</button>
          <span id="server-status" class="status-dot offline" title="Obsidian server status"></span>
          <button id="settings-btn" class="settings-btn" title="Settings">⚙️</button>
        </div>
      </div>
    </header>

    <!-- State 1: Capture -->
    <div id="capture-state">
      <div id="page-info" class="page-info">
        <div class="page-title" id="page-title">Loading...</div>
        <div class="page-url" id="page-url"></div>
        <div class="page-type" id="page-type"></div>
      </div>

      <button id="questions-toggle" class="questions-toggle">💭 Ask your own questions</button>
      <div id="questions-area" class="questions-area hidden">
        <textarea id="custom-questions" rows="3"
          placeholder="One question per line — answered along with the egg's key questions."></textarea>
      </div>

      <div id="warning-banner" class="warning-banner hidden">
        <span class="warning-icon">⚠️</span>
        <div id="warning-message"></div>
      </div>

      <div id="error-banner" class="error-banner hidden">
        <span class="error-icon">❌</span>
        <div>
          <div id="error-message"></div>
          <div id="error-hint" class="error-hint hidden"></div>
        </div>
      </div>

      <div id="duplicate-banner" class="duplicate-banner hidden">
        <span class="duplicate-icon">📎</span>
        <span id="duplicate-message"></span>
      </div>

      <button id="analyze-btn" class="analyze-btn" disabled>
        <span id="analyze-btn-text">Analyze</span>
      </button>
    </div>

    <!-- State 2: Results -->
    <div id="results-state" class="hidden">
      <div id="processed-note" class="duplicate-banner hidden">
        <span class="duplicate-icon">📎</span>
        <span id="processed-message"></span>
      </div>

      <div class="result-section">
        <div class="section-label">🎯 Title Verdict</div>
        <div id="verdict-answer" class="summary-text"></div>
      </div>

      <div class="result-section">
        <div class="section-label">📋 Core Summary</div>
        <ul id="core-summary" class="core-summary"></ul>
      </div>

      <div id="chapter-section" class="result-section hidden">
        <div class="section-label">🗺️ Chapter Map <span class="section-hint">(click to jump)</span></div>
        <div id="chapter-list" class="chapter-list"></div>
      </div>

      <div id="custom-questions-section" class="result-section hidden">
        <div class="section-label">💭 Your Questions</div>
        <div id="custom-questions-list" class="keyquestions-list"></div>
        <div class="followup-area">
          <input id="followup-input" type="text" placeholder="Ask a follow-up question about this content…" />
          <button id="followup-btn" class="followup-btn">Ask</button>
        </div>
      </div>

      <div id="keyquestions-section" class="result-section hidden">
        <div class="section-label">💬 Key Questions</div>
        <div id="keyquestions-list" class="keyquestions-list"></div>
      </div>

      <div id="delta-section" class="result-section hidden">
        <div class="section-label">🆕 Novel Delta</div>
        <div id="delta-list" class="delta-list"></div>
      </div>

      <div class="result-section">
        <div class="section-label">📖 Should you read it?</div>
        <div id="verdict-badge" class="verdict-badge">
          <span id="verdict-icon"></span>
          <span id="verdict-text"></span>
        </div>
        <div id="verdict-reason" class="verdict-reason"></div>
      </div>

      <div class="action-buttons">
        <button id="confirm-btn" class="confirm-btn hidden">🥚 Hatch Egg</button>
        <button id="save-raw-btn" class="save-raw-btn">🥜 Collect Nut</button>
        <button id="discard-btn" class="discard-btn">Discard</button>
        <button id="back-btn" class="back-btn">← Back</button>
      </div>

      <div id="success-banner" class="success-banner hidden">
        <span class="success-icon">✅</span>
        <span id="success-message"></span>
      </div>
    </div>

    <div id="metrics-bar" class="metrics-bar">
      <span class="metric" title="Nuts collected">🥜 <strong id="metric-nuts">0</strong></span>
      <span class="metric" title="Eggs created">🥚 <strong id="metric-eggs">0</strong></span>
      <span class="metric" title="Time saved">⏱️ <strong id="metric-time">0m</strong></span>
    </div>

    <footer class="footer">
      <small>NutEgg v1.0.0</small>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
