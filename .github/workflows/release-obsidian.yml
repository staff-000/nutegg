name: Release Obsidian Plugin

on:
  push:
    tags:
      - 'nutegg-obsidian-plugin-*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Push to Release Repository
    runs-on: ubuntu-latest

    env:
      TARGET_REPO: ${{ github.repository_owner }}/nutegg-obsidian-release

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify release source and version
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${SOURCE_TAG#nutegg-obsidian-plugin-}"
          node scripts/release-tools.mjs verify-source "$GITHUB_WORKSPACE" "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Determine Obsidian workspace & compile
        run: |
          # Support both packages/obsidian and obsidian-plugin directory paths
          if [ -d "packages/obsidian" ]; then
            PLUGIN_DIR="packages/obsidian"
          else
            PLUGIN_DIR="obsidian-plugin"
          fi
          echo "PLUGIN_DIR=$PLUGIN_DIR" >> $GITHUB_ENV

          echo "Compiling Obsidian plugin in $PLUGIN_DIR..."
          npm run build:plugin || (cd "$PLUGIN_DIR" && npm run build)

      - name: Verify build artifacts
        run: |
          echo "Verifying compiled artifacts in $PLUGIN_DIR..."
          for file in main.js manifest.json styles.css; do
            if [ ! -f "$PLUGIN_DIR/$file" ]; then
              echo "❌ Error: Missing $PLUGIN_DIR/$file"
              exit 1
            fi
            echo "✅ $PLUGIN_DIR/$file ($(wc -c < "$PLUGIN_DIR/$file") bytes)"
          done

      - name: Attest exact release assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          create-storage-record: false
          subject-path: |
            ${{ env.PLUGIN_DIR }}/main.js
            ${{ env.PLUGIN_DIR }}/manifest.json
            ${{ env.PLUGIN_DIR }}/styles.css

      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.RELEASE_PAT || secrets.RELEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: release-repo

      - name: Push artifacts and create release
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_PROVENANCE_NOTE: "Build provenance: https://github.com/${{ github.repository }}/attestations — verify provenance.json against the source repository. Instructions: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/releasing.md#verify-obsidian-release-provenance"
          NEW_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.RELEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG="$SOURCE_TAG"
          VERSION="${TAG#nutegg-obsidian-plugin-}"
          RELEASE_TAG="$VERSION"

          echo "Syncing artifacts to $TARGET_REPO for $TAG ($RELEASE_TAG)..."
          cp "$PLUGIN_DIR/main.js" release-repo/
          cp "$PLUGIN_DIR/manifest.json" release-repo/
          cp "$PLUGIN_DIR/styles.css" release-repo/
          [ -f "$PLUGIN_DIR/README.md" ] && cp "$PLUGIN_DIR/README.md" release-repo/

          bash scripts/prepare-release-provenance.sh \
            "$SOURCE_REPO" "$TARGET_REPO" "$RELEASE_TAG" "$SOURCE_TAG" "$SOURCE_SHA" \
            "$NEW_BUNDLE" release-repo/provenance.json \
            release-repo/main.js release-repo/manifest.json release-repo/styles.css

          cd release-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add main.js manifest.json styles.css
          [ -f README.md ] && git add README.md
          
          DEFAULT_BRANCH=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@' || true)
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          
          bash "$GITHUB_WORKSPACE/scripts/publish-release-assets.sh" \
            "$TARGET_REPO" "$RELEASE_TAG" "$TAG" "$DEFAULT_BRANCH" main.js manifest.json styles.css provenance.json
