name: Release Chrome Extension

on:
  push:
    tags:
      - 'nutegg-chrome-extension-*'

permissions:
  contents: write

jobs:
  release:
    name: Package & Push to Release Repository
    runs-on: ubuntu-latest

    env:
      TARGET_REPO: ${{ github.repository_owner }}/nutegg-chrome-extension-release

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify release source and version
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${SOURCE_TAG#nutegg-chrome-extension-}"
          node scripts/release-tools.mjs verify-source "$GITHUB_WORKSPACE" "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Determine Chrome Extension workspace
        run: |
          # Support both packages/chrome-extension and chrome-extension directory paths
          if [ -d "packages/chrome-extension" ]; then
            EXT_DIR="packages/chrome-extension"
          else
            EXT_DIR="chrome-extension"
          fi
          echo "EXT_DIR=$EXT_DIR" >> $GITHUB_ENV

      - name: Build extension artifacts
        run: |
          echo "Building Chrome extension in $EXT_DIR..."
          if [ -f "$EXT_DIR/build.js" ]; then
            node "$EXT_DIR/build.js"
          elif [ -f "$EXT_DIR/build-prompts.js" ]; then
            node "$EXT_DIR/build-prompts.js"
          fi

      - name: Verify extension files
        run: |
          echo "Verifying extension files in $EXT_DIR..."
          if [ ! -f "$EXT_DIR/manifest.json" ]; then
            echo "❌ Error: Missing $EXT_DIR/manifest.json"
            exit 1
          fi
          if [ ! -d "$EXT_DIR/src" ]; then
            echo "❌ Error: Missing $EXT_DIR/src directory"
            exit 1
          fi
          if [ ! -d "$EXT_DIR/_locales" ]; then
            echo "❌ Error: Missing $EXT_DIR/_locales directory"
            exit 1
          fi
          if [ ! -f "$EXT_DIR/dist/ai-core.js" ]; then
            echo "❌ Error: Missing $EXT_DIR/dist/ai-core.js build artifact"
            exit 1
          fi
          echo "✅ Validated manifest.json, src directory, _locales, and dist/ai-core.js."

      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.RELEASE_PAT || secrets.RELEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: release-repo

      - name: Package zip and push to release repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.RELEASE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#nutegg-chrome-extension-}"
          RELEASE_TAG="$VERSION"

          ROOT_DIR="$(pwd)"
          ZIP_NAME="nutegg-chrome-extension-${RELEASE_TAG}.zip"
          ZIP_PATH="$ROOT_DIR/$ZIP_NAME"

          echo "Preparing Chrome extension release for $TAG ($RELEASE_TAG)..."

          # 1. Build standalone zip distribution artifact
          python3 scripts/package-extension.py "$EXT_DIR" "$ZIP_PATH"
          echo "✅ Created $ZIP_NAME ($(wc -c < "$ZIP_PATH") bytes)"

          # 2. Sync source files to release repository
          rm -rf release-repo/src release-repo/icons release-repo/dist release-repo/_locales
          cp -r "$EXT_DIR/src" release-repo/
          cp -r "$EXT_DIR/icons" release-repo/
          [ -d "$EXT_DIR/_locales" ] && cp -r "$EXT_DIR/_locales" release-repo/
          [ -d "$EXT_DIR/dist" ] && cp -r "$EXT_DIR/dist" release-repo/
          cp "$EXT_DIR/manifest.json" release-repo/
          [ -f "$EXT_DIR/package.json" ] && cp "$EXT_DIR/package.json" release-repo/
          [ -f "$EXT_DIR/README.md" ] && cp "$EXT_DIR/README.md" release-repo/
          [ -f "$EXT_DIR/LICENSE" ] && cp "$EXT_DIR/LICENSE" release-repo/
          [ -f "$EXT_DIR/PRIVACY.md" ] && cp "$EXT_DIR/PRIVACY.md" release-repo/

          # 3. Commit and push to release repo
          cd release-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add manifest.json src icons
          [ -d _locales ] && git add _locales
          [ -d dist ] && git add dist
          [ -f package.json ] && git add package.json
          [ -f README.md ] && git add README.md
          [ -f LICENSE ] && git add LICENSE
          [ -f PRIVACY.md ] && git add PRIVACY.md
          
          DEFAULT_BRANCH=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@' || true)
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"

          bash "$GITHUB_WORKSPACE/scripts/publish-release-assets.sh" \
            "$TARGET_REPO" "$RELEASE_TAG" "$TAG" "$DEFAULT_BRANCH" "$ZIP_PATH"
